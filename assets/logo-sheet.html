<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AgentHQ logo sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #E9ECF4;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 40px;
    }
    .sheet {
      width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .hero-card {
      background: #0B1020;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 60px 40px;
    }
    .hero-brand {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 96px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #FFFFFF;
    }
    .hero-title span { color: #22D3EE; }
    .hero-tagline {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #A5B0CC;
    }
    .grid {
      display: flex;
      gap: 24px;
      height: 240px;
    }
    .light-card {
      flex: 1;
      background: #F4F6FB;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .light-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #0B1020;
    }
    .light-title span { color: #0E7490; }
    .app-icon-card {
      width: 240px;
      background: #F4F6FB;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-icon {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      background: #0B1020;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 36px rgba(11, 16, 32, 0.22);
    }
    .accent-card {
      width: 240px;
      background: #22D3EE;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="hero-card">
      <svg viewBox="0 0 200 200" width="180" height="180" aria-hidden="true">
        <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="#22D3EE" stroke-width="8" stroke-linejoin="round"/>
        <line x1="100" y1="100" x2="100" y2="20" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="169.3" y2="140" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
        <line x1="100" y1="100" x2="30.7" y2="140" stroke="#22D3EE" stroke-width="6" stroke-linecap="round"/>
        <circle cx="100" cy="20" r="11" fill="#0B1020" stroke="#22D3EE" stroke-width="6"/>
        <circle cx="169.3" cy="140" r="11" fill="#0B1020" stroke="#22D3EE" stroke-width="6"/>
        <circle cx="30.7" cy="140" r="11" fill="#0B1020" stroke="#22D3EE" stroke-width="6"/>
        <circle cx="100" cy="100" r="19" fill="#8B5CF6"/>
      </svg>
      <div class="hero-brand">
        <div class="hero-title">Agent<span>HQ</span></div>
        <div class="hero-tagline">Your AI team, one command center</div>
      </div>
    </div>

    <div class="grid">
      <div class="light-card">
        <svg viewBox="0 0 200 200" width="72" height="72" aria-hidden="true">
          <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="#0E7490" stroke-width="8" stroke-linejoin="round"/>
          <line x1="100" y1="100" x2="100" y2="20" stroke="#0E7490" stroke-width="6" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="169.3" y2="140" stroke="#0E7490" stroke-width="6" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="30.7" y2="140" stroke="#0E7490" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="20" r="11" fill="#F4F6FB" stroke="#0E7490" stroke-width="6"/>
          <circle cx="169.3" cy="140" r="11" fill="#F4F6FB" stroke="#0E7490" stroke-width="6"/>
          <circle cx="30.7" cy="140" r="11" fill="#F4F6FB" stroke="#0E7490" stroke-width="6"/>
          <circle cx="100" cy="100" r="19" fill="#6D28D9"/>
        </svg>
        <div class="light-title">Agent<span>HQ</span></div>
      </div>

      <div class="app-icon-card">
        <div class="app-icon">
          <svg viewBox="0 0 200 200" width="90" height="90" aria-hidden="true">
            <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="#22D3EE" stroke-width="9" stroke-linejoin="round"/>
            <line x1="100" y1="100" x2="100" y2="20" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
            <line x1="100" y1="100" x2="169.3" y2="140" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
            <line x1="100" y1="100" x2="30.7" y2="140" stroke="#22D3EE" stroke-width="7" stroke-linecap="round"/>
            <circle cx="100" cy="20" r="12" fill="#0B1020" stroke="#22D3EE" stroke-width="7"/>
            <circle cx="169.3" cy="140" r="12" fill="#0B1020" stroke="#22D3EE" stroke-width="7"/>
            <circle cx="30.7" cy="140" r="12" fill="#0B1020" stroke="#22D3EE" stroke-width="7"/>
            <circle cx="100" cy="100" r="21" fill="#8B5CF6"/>
          </svg>
        </div>
      </div>

      <div class="accent-card">
        <svg viewBox="0 0 200 200" width="120" height="120" aria-hidden="true">
          <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="#0B1020" stroke-width="8" stroke-linejoin="round"/>
          <line x1="100" y1="100" x2="100" y2="20" stroke="#0B1020" stroke-width="6" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="169.3" y2="140" stroke="#0B1020" stroke-width="6" stroke-linecap="round"/>
          <line x1="100" y1="100" x2="30.7" y2="140" stroke="#0B1020" stroke-width="6" stroke-linecap="round"/>
          <circle cx="100" cy="20" r="11" fill="#22D3EE" stroke="#0B1020" stroke-width="6"/>
          <circle cx="169.3" cy="140" r="11" fill="#22D3EE" stroke="#0B1020" stroke-width="6"/>
          <circle cx="30.7" cy="140" r="11" fill="#22D3EE" stroke="#0B1020" stroke-width="6"/>
          <circle cx="100" cy="100" r="19" fill="#0B1020"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
