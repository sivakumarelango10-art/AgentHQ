name: AgentHQ CI

on:
  pull_request:
    branches: [main, feature/cloud-readiness]
  push:
    branches: [main, feat/phase4-approved-agent-workflow]

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Test response sanitization
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  hermes3d-pin:
    name: Verify Hermes3D submodule pin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AgentHQ
        uses: actions/checkout@v4

      - name: Verify production submodule SHA
        shell: bash
        run: |
          set -euo pipefail
          expected="ca3ba1d02fa0d0bfa2e5e249c54f58c1197bb0b1"
          actual="$(git ls-tree HEAD hermes3d | awk '{print $3}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Expected Hermes3D ${expected}, got ${actual}"
            exit 1
          fi
          echo "AgentHQ pins the Hermes3D revision that passed its own CI: ${actual}"

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
