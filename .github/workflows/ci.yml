name: AgentHQ CI

on:
  pull_request:
    branches: [main, feature/cloud-readiness]
  push:
    branches: [main, feat/phase4-approved-agent-workflow]

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/app
      - name: Test response sanitization
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  hermes3d-integration:
    name: Hermes3D submodule typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AgentHQ and Hermes3D
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hermes3d/package-lock.json

      - name: Install Hermes3D dependencies
        working-directory: hermes3d
        run: npm ci

      - name: Hermes3D typecheck
        working-directory: hermes3d
        run: npm run typecheck

      - name: Hermes3D unit tests
        working-directory: hermes3d
        run: npm run test -- --run

      - name: Hermes3D production build
        working-directory: hermes3d
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: production
          RUNTIME_API_TOKEN: ci-runtime-token
          AGENTHQ_URL: http://127.0.0.1:8000
        run: npm run build

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
