name: AgentHQ Isolated Repository Tests
run-name: AgentHQ isolated tests - ${{ inputs.execution_id }}

on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: AgentHQ execution identifier
        required: true
        type: string
      target_ref:
        description: AgentHQ-generated branch to test
        required: true
        type: string
      target_sha:
        description: Exact commit expected from target_ref
        required: true
        type: string
      profile:
        description: Project test profile
        required: true
        type: choice
        options:
          - auto
          - node
          - python
        default: auto

permissions: {}

concurrency:
  group: agenthq-sandbox-${{ inputs.execution_id }}
  cancel-in-progress: false

jobs:
  mark-pending:
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Mark target commit as pending
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          EXECUTION_ID: ${{ inputs.execution_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.TARGET_SHA || "";
            const executionId = process.env.EXECUTION_ID || "";
            if (!/^[0-9a-f]{40}$/i.test(sha) || !/^[A-Za-z0-9_-]{1,64}$/.test(executionId)) {
              throw new Error("Invalid AgentHQ sandbox dispatch inputs.");
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: "pending",
              context: "AgentHQ / isolated repository tests",
              description: "Waiting for the isolated test runner.",
              target_url: context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
            });

  isolated-tests:
    needs: mark-pending
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CI: "true"
      EXECUTION_ID: ${{ inputs.execution_id }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_SHA: ${{ inputs.target_sha }}
      REQUESTED_PROFILE: ${{ inputs.profile }}
    steps:
      - name: Validate checkout inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXECUTION_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "Invalid execution ID"; exit 1; }
          expected_suffix="$(printf "%s" "$EXECUTION_ID" | sha256sum | cut -c1-16)"
          expected_ref="agenthq/execution-${expected_suffix}"
          [[ "$TARGET_REF" == "$expected_ref" ]] || { echo "Target branch does not match execution ID"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid target SHA"; exit 1; }
          [[ "$REQUESTED_PROFILE" =~ ^(auto|node|python)$ ]] || { echo "Invalid project profile"; exit 1; }

      - name: Checkout exact approved execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo "Expected $TARGET_SHA but checked out $actual"
            exit 1
          fi

      - name: Detect project profile
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          profile="$REQUESTED_PROFILE"
          if [[ "$profile" == "auto" ]]; then
            if [[ -f package.json ]]; then
              profile="node"
            elif [[ -f requirements.txt || -f backend/requirements.txt ]]; then
              profile="python"
            else
              echo "No supported Node.js or Python project manifest was found."
              exit 1
            fi
          fi
          if [[ "$profile" == "node" && ! -f package.json ]]; then
            echo "Node.js profile requires package.json."
            exit 1
          fi
          if [[ "$profile" == "python" && ! -f requirements.txt && ! -f backend/requirements.txt ]]; then
            echo "Python profile requires requirements.txt or backend/requirements.txt."
            exit 1
          fi
          echo "selected=$profile" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.profile.outputs.selected == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node.js dependencies
        if: steps.profile.outputs.selected == 'node'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "A package-lock.json or npm-shrinkwrap.json is required for reproducible sandbox installs."
            exit 1
          fi
          node -e "const p=require('./package.json'); if (!p.scripts?.test) { console.error('package.json must define a test script'); process.exit(1); }"

      - name: Run Node.js tests and quality scripts
        if: steps.profile.outputs.selected == 'node'
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck --if-present
          npm run build --if-present

      - name: Set up Python
        if: steps.profile.outputs.selected == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.profile.outputs.selected == 'python'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          if [[ -f requirements.txt ]]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          elif [[ -f backend/requirements.txt ]]; then
            python -m pip install --disable-pip-version-check -r backend/requirements.txt
          fi

      - name: Run Python tests
        if: steps.profile.outputs.selected == 'python'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d backend/tests && -f backend/requirements.txt ]]; then
            python -m compileall -q backend/app
            (
              cd backend
              PYTHONPATH=. python -m unittest discover -s tests -v
            )
          else
            python -m compileall -q .
            python -m pytest -q
          fi

  publish-result:
    if: always()
    needs:
      - mark-pending
      - isolated-tests
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
    steps:
      - name: Publish isolated test result
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          TEST_RESULT: ${{ needs.isolated-tests.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const sha = process.env.TARGET_SHA || "";
            const result = process.env.TEST_RESULT || "failure";
            if (!/^[0-9a-f]{40}$/i.test(sha)) {
              throw new Error("Invalid AgentHQ sandbox target SHA.");
            }
            const state = result === "success" ? "success" : "failure";
            const description = state === "success"
              ? "Isolated repository tests passed."
              : "Isolated repository tests failed; inspect the runner log.";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: "AgentHQ / isolated repository tests",
              description,
              target_url: context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId,
            });
